name: Build APK (Android)

on:
  workflow_dispatch:
    inputs:
      profile:
        description: "Perfil del EAS"
        required: true
        default: preview
        type: choice
        options:
          - preview
          - production

jobs:
  build:
    name: EAS Build Android
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Instalar EAS CLI
        run: npm install -g eas-cli

      - name: Instalar dependencias
        run: npm install
        working-directory: mobile

      - name: Crear APK
        run: |
          eas build \
            --platform android \
            --profile ${{ github.event.inputs.profile }} \
            --non-interactive \
            --json > build.json
        working-directory: mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Descargar APK
        run: |
          APK_URL=$(node -e "const fs=require('fs'); const data=JSON.parse(fs.readFileSync('build.json','utf8')); console.log(data[0].artifacts.buildUrl)")
          echo "Descargando APK..."
          curl -L "$APK_URL" -o app.apk
        working-directory: mobile

      - name: Subir APK a GitHub
        uses: actions/upload-artifact@v4
        with:
          name: checkout-pro-apk
          path: mobile/app.apk
